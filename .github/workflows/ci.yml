name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.20"
            otp: "27"
          - elixir: "1.20"
            otp: "28"
          - elixir: "1.20"
            otp: "29"

    env:
      MIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test --exclude benchmark

      - name: Coverage JSON
        if: matrix.elixir == '1.20' && matrix.otp == '29'
        run: mix coveralls.json --exclude benchmark

      - name: Upload coverage to Codecov
        if: matrix.elixir == '1.20' && matrix.otp == '29'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cover/excoveralls.json
          fail_ci_if_error: true
          verbose: true

  quality:
    name: Quality (format, credo, deps, dialyzer)
    runs-on: ubuntu-latest

    env:
      MIX_ENV: dev
      ELIXIR_VERSION: "1.20"
      OTP_VERSION: "29"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-quality-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-quality-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      # Fails if mix.lock would change — catches an uncommitted lockfile.
      - name: Install dependencies (locked)
        run: mix deps.get --check-locked

      # Fails if mix.lock carries entries no dependency needs any more.
      - name: Check for unused lock entries
        run: mix deps.unlock --check-unused

      # Flags retired packages and Hex security advisories.
      - name: Audit dependencies
        run: mix hex.audit

      - name: Check formatting
        run: mix format --check-formatted

      # CI previously never failed on compiler warnings; this closes that gap.
      - name: Compile (warnings as errors)
        run: mix compile --force --warnings-as-errors

      - name: Credo (strict)
        run: mix credo --strict

      # The PLT is expensive to build and depends on the Elixir/OTP pair, so it gets
      # its own cache entry keyed on those plus the lockfile.
      - name: Cache Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: plts
          key: ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Dialyzer
        run: mix dialyzer --format github
